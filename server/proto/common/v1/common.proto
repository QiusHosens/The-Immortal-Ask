syntax = "proto3";

package immortal.ask.common.v1;

option go_package = "immortal/ask/common/v1";

// 通用响应码
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_OK = 1;
  ERROR_CODE_INVALID_ARGUMENT = 2;
  ERROR_CODE_UNAUTHORIZED = 3;
  ERROR_CODE_NOT_FOUND = 4;
  ERROR_CODE_CONFLICT = 5;
  ERROR_CODE_INTERNAL = 6;
}

message Empty {}

message Pagination {
  uint32 page = 1;
  uint32 page_size = 2;
}

message PageInfo {
  uint32 page = 1;
  uint32 page_size = 2;
  uint64 total = 3;
}
